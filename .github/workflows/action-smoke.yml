name: Action Self-Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  action-smoke:
    # Selbsttest: nutzt die Action wie ein Kunde (Ref @v0 nach Release)
    # wird hier exakt so verwendet, wie es ein Kunde tun würde.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: agentguard-dev/agentguard@v0
        with:
          exit-on: critical
          # v0.2.1: repo-eigene .agentguard-ignore wird in CI absichtlich
          # ignoriert (Bypass-Schutz) — Ausnahmen kommen über den exclude-Input.
          exclude: "test docs"   # eigene Attack-Fixtures + Payload-Doku
