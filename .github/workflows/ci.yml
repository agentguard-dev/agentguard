name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  dogfood:
    # AgentGuard scannen sich selbst — eats its own dog food.
    #
    # SECURITY: --no-ignore ist hier zwingend. Eine PR-eigene .agentguard-ignore
    # könnte sonst genau die Dateien ausblenden, die sie prüfen soll — derselbe
    # Bypass, gegen den die Action ihre Kunden mit --no-ignore härtet
    # (scripts/action-gate.sh). Ausnahmen stehen deshalb hier im Workflow
    # (Basis-Branch, review-pflichtig) statt in einer PR-editierbaren Datei:
    #   test/  — Angriffs-Fixtures, docs/ — Doku, die Angriffe zitiert.
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Self-scan (engine off, deterministic)
        run: node cli.js scan --path . --engine off --format summary --no-ignore --exclude test --exclude docs >> "$GITHUB_STEP_SUMMARY"
      - name: Block critical findings
        run: node cli.js scan --path . --engine off --exit-on critical --no-ignore --exclude test --exclude docs
