name: "agentguard-security"
description: "CI gate that scans agent configs (AGENTS.md, MCP, hooks, skills) for prompt injection, secrets and permission traps."
author: "AgentGuard"
branding:
  icon: "shield"
  color: "red"

inputs:
  path:
    description: "Verzeichnis (relativ zum Repo), das gescannt werden soll"
    required: false
    default: "."
  exit-on:
    description: "Ab welcher Schwere der Job fehlschlägt (critical|high|medium|low|info|never)"
    required: false
    default: "critical"
  exclude:
    description: "Zusätzliche Ausschluss-Globs, leerzeichengetrennt (gitignore-Stil)"
    required: false
    default: ""
  waiver-issue:
    description: "Break-Glass-Beleg: Nummer des Waiver-Issues (docs/BREAK-GLASS.md)"
    required: false
    default: ""
  strict:
    description: "true = exit-on:never ohne waiver-issue schlägt fehl (fail-closed)"
    required: false
    default: "false"
  mode:
    description: "scan (Default) oder guardian (Break-Glass-Ablauf-Prüfung, siehe workflow-templates/)"
    required: false
    default: "scan"

runs:
  using: "composite"
  steps:
    - name: "AgentGuard scan"
      if: ${{ inputs.mode != 'guardian' }}
      shell: "bash"
      env:
        AG_PATH: ${{ inputs.path }}
        AG_EXIT_ON: ${{ inputs.exit-on }}
        AG_EXCLUDE: ${{ inputs.exclude }}
        AG_WAIVER_ISSUE: ${{ inputs.waiver-issue }}
        AG_STRICT: ${{ inputs.strict }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action-gate.sh"
    - name: "AgentGuard guardian"
      if: ${{ inputs.mode == 'guardian' }}
      shell: "bash"
      env:
        AG_REPO: ${{ github.repository }}
        AG_TOKEN: ${{ github.token }}
        AG_DRY_RUN: ${{ inputs.path == 'dry-run' && '1' || '' }}
      run: node "$GITHUB_ACTION_PATH/scripts/guardian.js"
